[project]
name = "local-ai-gateway"
version = "0.1.0"
description = "A lightweight local OpenAI-compatible model routing gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
local-ai-gateway = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
